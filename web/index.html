<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIPROS 流程图</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%231e3a5f'/%3E%3Cpath d='M8 16h6m4 0h6M14 16c2 0 2-6 4-6s2 12 4 12' stroke='%23f0b429' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='16' r='2.4' fill='%23f0b429'/%3E%3Ccircle cx='24' cy='16' r='2.4' fill='%23f0b429'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo">AP</span>
      <span class="brand-name">AIPROS<em>流程图</em></span>
    </div>
    <input id="doc-title" class="doc-title" value="未命名文件" spellcheck="false">
    <div class="toolbar">
      <a href="/editor" target="_blank" class="official-entry">官方引擎编辑器 · 打开泳道图</a>
      <button id="btn-layout" title="ELK 自动布局">⌁ 自动布局</button>
      <span class="sep"></span>
      <button id="btn-import" title="导入 .posf">↥ 导入</button>
      <button id="btn-export-posf" title="下载 .posf 文件">↧ .posf</button>
      <button id="btn-export-svg" title="导出 SVG">↧ SVG</button>
      <span class="sep"></span>
      <button id="btn-save" title="保存到服务器">⬒ 保存</button>
      <button id="btn-open" title="打开服务器文档">⬒ 打开</button>
      <span class="sep"></span>
      <button id="btn-undo" title="撤销 Ctrl+Z">↺</button>
      <button id="btn-clear" title="清空画布">✕ 清空</button>
    </div>
  </header>

  <div id="main">
    <aside id="palette">
      <div class="palette-search">
        <input id="shape-search" placeholder="搜索 4819 个形状…" spellcheck="false">
        <select id="shape-category"><option value="">Flowchart 流程图</option></select>
      </div>
      <div id="shape-list"></div>
    </aside>

    <main id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
            <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#e9edf2" stroke-width="0.5"/>
          </pattern>
          <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
          </marker>
        </defs>
        <rect id="grid-bg" fill="url(#grid)"/>
        <g id="view"></g>
      </svg>
      <div id="hint" class="hint">
        <b>开始</b>
        <p>点击左侧形状添加节点 · 拖动移动 · 双击编辑文字<br>
        点击工具栏 <b>⌁ 自动布局</b> 一键排版 · 导出 .posf 可用官方桌面客户端打开</p>
      </div>
      <div id="connect-tip" class="connect-tip hidden">连线模式：点击起点节点，再点击终点节点 · <b>Esc 取消</b></div>
      <div id="zoom-bar">
        <button id="zoom-out">−</button><span id="zoom-level">100%</span><button id="zoom-in">+</button><button id="zoom-fit">Fit</button>
      </div>
      <input id="text-editor" class="hidden" spellcheck="false">
    </main>
  </div>
</div>

<input type="file" id="file-input" accept=".posf" class="hidden">
<div id="toast" class="hidden"></div>
<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <div class="modal-title">打开文档</div>
    <div id="doc-list" class="doc-list"></div>
    <button id="modal-close" class="ghost">关闭</button>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
