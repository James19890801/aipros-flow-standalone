<body style="height: 100%; width: 100%;">
  <div class="mind-container" id="app" style="height: 100%; width: 100%;"></div>
  <script>
    window.chartType = "mind", window.isTemplate = "";
    window.fileType = 'markdown'
    /**
       * 下拉
       */
    var currentMenu = null;
    $.fn.dropdown = function (options) {
      // debugger
      var menu = $(this);
      menu.find(".po-selected-icon").remove();
      if (typeof options == "string") {
        if (options == "close") {
          menu.hide();
          currentMenu != null && currentMenu.target.removeClass("selected");
          $(document).unbind("mousedown.ui_dropdown");
          currentMenu = null;
        } else if (options == "select") {
          arguments[1].children(".po-menu-item-box").prepend("<div class='po-selected-icon po-diagraming-icons'>&#xe6ba;</div>");
        }
        return;
      }
      if (currentMenu != null) {
        /**
         * 如果当前有其他菜单是打开的，则要先关闭
         */
        currentMenu.menu.dropdown("close");
      }
      var menu = $(this);
      var tar = options.target;
      currentMenu = {
        target: tar,
        menu: menu
      };
      var offset = tar.offset();
      tar.addClass("selected");
      menu.show();
      var left;
      if (options.position == "center") {
        left = offset.left + tar.outerWidth() / 2 - menu.outerWidth() / 2;
      } else if (options.position == "right") {
        left = offset.left + tar.outerWidth() - menu.outerWidth();
      } else {
        left = offset.left;
      }
      var top = offset.top + tar.outerHeight();
      if (top + menu.outerHeight() > $(window).height()) {
        top = $(window).height() - menu.outerHeight();
      }
      menu.css({
        top: top + 4,
        left: left
      });
      if (typeof options.zindex != "undefined") {
        menu.css("z-index", options.zindex);
      }
      menu.unbind("mousedown").bind("mousedown", function (e) {
        e.stopPropagation();
      });
      if (typeof options.bind == "undefined" || options.bind == true) {
        menu.find("li:not(.devider,.menu_text)").off("click").on("click", function () {
          var item = $(this);
          if (!item.menuitem("isDisabled") && !item.hasClass("extend")) {
            if (options.onSelect) {
              options.onSelect(item);
            }
            menu.dropdown("close");
          }
        });
      }
      $(document).bind("mousedown.ui_dropdown", function (e) {
        //页面下拉背景色屏蔽
        if ($(e.target).parents("#color_picker").length) { return }
        menu.dropdown("close");
      });
    };

    /**
     * 菜单项
     */
    $.fn.menuitem = function (options) {
      var target = $(this);
      if (typeof options == "string") {
        if (options == "disable") {
          target.addClass("disabled");
        } else if (options == "enable") {
          target.removeClass("disabled");
        } else if (options == "isDisabled") {
          return target.hasClass("disabled");
        } else if (options == "isSelected") {
          return target.children(".po-menu-item-box").children(".po-selected-icon").length > 0;
        } else if (options == "unselect") {
          return target.children(".po-menu-item-box").children(".po-selected-icon").remove();
        } else if (options == "select") {
          return target.children(".po-menu-item-box").prepend("<div class='po-selected-icon po-diagraming-icons'>&#xe6ba;</div>")
        }
      }
    };

  </script>
